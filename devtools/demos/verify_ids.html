<!DOCTYPE html>
<html><body>
<div id="p" style="width:600px;height:300px"></div>
<script src="http://127.0.0.1:8080/dist/plotly.js"></script>
<script>
Plotly.newPlot('p',[{
    mode:'markers',
    x:[1,2,3,4,5],
    y:[1,2,3,2,1],
    marker:{
        symbol:['circle','square','M10,0L0,10L-10,0Z','circle-dot','square'],
        size:20
    }
}]).then(function(){
    var symbols = document.querySelectorAll('defs symbol');
    var uses = document.querySelectorAll('use.point');
    console.log('SYMBOLS:');
    for(var i=0;i<symbols.length;i++) console.log('  id=' + symbols[i].id + ' paths=' + symbols[i].querySelectorAll('path').length);
    console.log('USE hrefs:');
    for(var i=0;i<uses.length;i++) console.log('  href=' + uses[i].getAttribute('href'));
    console.log('DONE');
});
</script></body></html>
