<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="http://127.0.0.1:8080/dist/plotly.js"></script>
</head>
<body>
<div id="plot" style="width:860px;height:460px"></div>
<script>
var SUN_PATH = 'M10,0A10,10 0 1,1 0,-10A10,10 0 0,1 10,0Z' +
    'M12,0L18,0M8.49,8.49L12.73,12.73' +
    'M0,12L0,18M-8.49,8.49L-12.73,12.73' +
    'M-12,0L-18,0M-8.49,-8.49L-12.73,-12.73' +
    'M0,-12L0,-18M8.49,-8.49L12.73,-12.73';
var CLOUD_PATH = 'M-12,4A7,7 0 1,1 -2,-4A8,8 0 1,1 10,-2A6,6 0 1,1 14,4L-12,4Z';
var WIND_PATHS = {
    1: 'M0,24L0,-24M0,-24L12,-18',
    2: 'M0,24L0,-24M0,-24L12,-18M0,-18L12,-12',
    3: 'M0,24L0,-24M0,-24L12,-18M0,-18L12,-12M0,-12L12,-6'
};
var locations = [
    {name:'Seattle',      lon:-122,lat:47,weather:{type:'cloudy'}},
    {name:'San Francisco',lon:-122,lat:38,weather:{type:'sunny'}},
    {name:'Denver',       lon:-105,lat:40,weather:{type:'sunny'}},
    {name:'Chicago',      lon:-88, lat:42,weather:{type:'cloudy'}},
    {name:'New York',     lon:-74, lat:41,weather:{type:'cloudy'}},
    {name:'Miami',        lon:-80, lat:26,weather:{type:'sunny'}},
    {name:'Dallas',       lon:-97, lat:33,weather:{type:'sunny'}},
    {name:'E 3',  lon:-115,lat:46,weather:{type:'wind',direction:100,speed:3}},
    {name:'ESE 3',lon:-108,lat:44,weather:{type:'wind',direction:110,speed:3}},
    {name:'SE 2', lon:-100,lat:42,weather:{type:'wind',direction:120,speed:2}},
    {name:'SE 2', lon:-93, lat:39,weather:{type:'wind',direction:130,speed:2}},
    {name:'SSE 1',lon:-85, lat:36,weather:{type:'wind',direction:150,speed:1}},
    {name:'S 1',  lon:-78, lat:33,weather:{type:'wind',direction:170,speed:1}}
];
var symbols=locations.map(function(l){
    if(l.weather.type==='sunny') return SUN_PATH;
    if(l.weather.type==='cloudy') return CLOUD_PATH;
    return WIND_PATHS[Math.min(l.weather.speed||1,3)];
});
Plotly.newPlot('plot',[{
    type:'scatter',mode:'markers+text',
    x:locations.map(function(l){return l.lon;}),
    y:locations.map(function(l){return l.lat;}),
    text:locations.map(function(l){return l.name;}),
    textposition:'bottom center',hoverinfo:'text',
    marker:{
        symbol:symbols,size:30,color:locations.map(function(l){
            if(l.weather.type==='sunny') return '#FFD700';
            if(l.weather.type==='cloudy') return '#708090';
            return '#4169E1';
        }),
        line:{width:2,color:'#333'},
        angle:locations.map(function(l){return l.weather.type==='wind'?l.weather.direction:0;})
    }
}],{
    title:'Weather Map Demo — SVG ⟨symbol⟩/⟨use⟩ Rendering',
    xaxis:{title:'Longitude',range:[-130,-70],gridcolor:'#ddd'},
    yaxis:{title:'Latitude',range:[20,52],scaleanchor:'x',gridcolor:'#ddd'},
    showlegend:false,margin:{l:50,r:20,t:50,b:40},
    paper_bgcolor:'#f8f8f8',plot_bgcolor:'#e8f4f8',
    font:{size:11}
}).then(function(){
    window._plotReady = true;
});
</script>
</body>
</html>
